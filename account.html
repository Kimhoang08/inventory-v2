<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ Đại lý - Techera Portal B2B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex antialiased selection:bg-brand-500 selection:text-white overflow-x-hidden">
  <div id="mainAppWrapper" class="flex-1 min-w-0 min-h-screen flex flex-col">
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 pb-24 space-y-6">

      <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-500 to-orange-600 text-white font-black text-xl flex items-center justify-center shadow-md">
            TT
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-extrabold text-slate-900">Công ty TNHH Du lịch Techera Travel</h1>
              <span class="px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 text-[10px] font-extrabold">Diamond TA</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">Mã đại lý: <strong class="font-mono text-slate-700">AGY-TECHERA</strong> • MST: <strong class="font-mono text-slate-700">0316892410</strong></p>
          </div>
        </div>
        <button type="button" onclick="TecheraDB.resetAll(); location.reload();" class="px-3.5 py-2 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-bold cursor-pointer">
          Khôi phục dữ liệu Mockup gốc
        </button>
      </div>

      <!-- Thống kê nhanh -->
      <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <div class="text-[11px] font-bold text-slate-500">Số dư Ví hiện tại</div>
          <div id="accPageWalletBalance" class="text-lg font-black text-emerald-600 mt-1">0 đ</div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <div class="text-[11px] font-bold text-slate-500">Công nợ tín dụng</div>
          <div id="accPageDebtAmount" class="text-lg font-black text-amber-600 mt-1">0 đ</div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <div class="text-[11px] font-bold text-slate-500">Tổng đơn đã lưu</div>
          <div id="accPageTotalOrders" class="text-lg font-black text-slate-900 mt-1">0 đơn</div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <div class="text-[11px] font-bold text-slate-500">Khách hàng CRM</div>
          <div id="accPageTotalCustomers" class="text-lg font-black text-brand-600 mt-1">0 khách</div>
        </div>
      </section>

      <!-- Form Thông tin & Xuất VAT -->
      <form onsubmit="saveAccountProfileForm(event)" class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4 text-xs">
        <h2 class="text-base font-extrabold text-slate-900">Thông tin doanh nghiệp & Hóa đơn điện tử VAT</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-slate-600 mb-1">Tên pháp lý xuất hóa đơn</label>
            <input type="text" value="Công ty TNHH Du lịch Techera Travel" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200" />
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-1">Mã số thuế (MST)</label>
            <input type="text" value="0316892410" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-mono" />
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-1">Email nhận hóa đơn GTGT</label>
            <input type="email" value="ketoan@techeratravel.vn" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200" />
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-1">Hotline điều hành</label>
            <input type="tel" value="0909 888 777" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200" />
          </div>
          <div class="sm:col-span-2">
            <label class="block font-bold text-slate-600 mb-1">Địa chỉ trụ sở</label>
            <input type="text" value="Tầng 8, Tòa nhà Viettel Complex, 285 Cách Mạng Tháng 8, Q.10, TP.HCM" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200" />
          </div>
        </div>
        <div class="flex justify-end pt-2">
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold cursor-pointer">
            Lưu thông tin hồ sơ
          </button>
        </div>
      </form>

    </main>
  </div>

  <!-- Scripts -->
  <script src="database/products.db.js"></script>
  <script src="database/crm.db.js"></script>
  <script src="database/orders.db.js"></script>
  <script src="database/cashflow.db.js"></script>
  <script src="database/db-store.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/layout.js?v=2.5.0"></script>
  <script src="assets/js/wallet-account.js"></script>
  <script>
    renderSharedShell({
      activePage: 'account.html',
      pageTitle: 'Hồ sơ & Tài khoản',
      showGlobalHeader: true
    });
  </script>
</body>
</html>
