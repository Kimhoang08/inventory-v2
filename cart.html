<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng đặt vé - Techera Portal B2B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/main.css?v=2.7.0" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex antialiased selection:bg-brand-500 selection:text-white overflow-x-hidden">
  <div id="mainAppWrapper" class="flex-1 min-w-0 min-h-screen flex flex-col">
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 pb-32 space-y-5">

      <!-- 1. Top Header -->
      <div class="bg-white rounded-2xl border border-slate-200/90 p-4 sm:p-5 flex items-center justify-between gap-3 shadow-xs">
        <div class="flex items-center gap-2.5 min-w-0">
          <a href="index.html" title="Quay lại" class="w-8 h-8 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-600 flex items-center justify-center shrink-0 transition-colors">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </a>
          <h1 class="text-base sm:text-lg font-black text-slate-900 truncate flex items-center gap-1.5">
            <span>Giỏ hàng</span>
            <span>(<span id="cartHeaderPackagesCount">0</span>)</span>
          </h1>
          <span id="cartHeaderTotalTicketsBadge" class="px-2.5 py-0.5 rounded-full bg-[#FFF7ED] border border-orange-200/80 text-[#F25C22] text-xs font-black shrink-0">0 vé</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnBatchDeleteCartItems" type="button" onclick="confirmDeleteSelectedCartItems()" class="hidden px-3.5 py-1.5 rounded-full bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 text-xs font-bold cursor-pointer transition-colors">
            Xóa đã chọn (<span id="cartEditSelectedCount">0</span>)
          </button>
          <button id="btnToggleCartEditMode" type="button" onclick="toggleCartEditMode()" class="px-4 py-1.5 rounded-full border border-slate-300 bg-white hover:border-[#F25C22] hover:text-[#F25C22] text-xs font-extrabold text-slate-700 shadow-2xs transition-all cursor-pointer">
            Sửa
          </button>
        </div>
      </div>

      <!-- Thông báo quy tắc 1 điểm đến / 1 lần thanh toán -->
      <div id="cartPolicyNotice" class="hidden p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-800 flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Lưu ý: Mỗi lượt thanh toán chỉ áp dụng cho vé thuộc <strong>cùng 1 điểm đến</strong> để đảm bảo xuất mã QR đồng bộ.</span>
      </div>

      <!-- Danh sách nhóm trong giỏ -->
      <div id="cartPageItemsContainer" class="space-y-4"></div>

    </main>
  </div>

  <!-- Thanh Tổng kết Dính Đáy (Chuẩn 1 hàng ngang Single-row layout đồng bộ) -->
  <div id="cartStickyBottomBar" class="hidden fixed bottom-16 lg:bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200/90 shadow-[0_-8px_25px_rgba(15,23,42,0.08)]">
    <div class="max-w-5xl mx-auto px-3 sm:px-6 py-2.5 sm:py-3.5 flex items-center justify-between gap-2 sm:gap-4 flex-nowrap">
      <!-- Cột trái: Checkbox Chọn tất cả -->
      <label class="flex items-center gap-2 sm:gap-2.5 text-xs font-bold text-slate-700 cursor-pointer select-none shrink-0">
        <input id="cartSelectAllCheckbox" type="checkbox" onchange="toggleSelectAllCartItems(this.checked)" class="w-4 h-4 accent-[#F25C22] rounded cursor-pointer shrink-0" />
        <span class="whitespace-nowrap text-xs font-bold text-slate-700">Chọn tất cả (<span id="cartStickyAllCount">0</span>)</span>
      </label>

      <!-- Cột phải: Cụm Tổng tiền và Nút Thanh toán (Cùng 1 hàng ngang, không rớt dòng) -->
      <div class="flex items-center gap-2.5 sm:gap-4 shrink-0 min-w-0">
        <div class="text-right leading-tight shrink-0">
          <div class="text-[10px] sm:text-[11px] text-slate-500 whitespace-nowrap">Tổng thanh toán (<span id="cartStickyTicketsCount" class="font-bold text-slate-700">0</span> vé):</div>
          <div id="cartStickyTotalAmount" class="text-sm sm:text-base md:text-lg font-black text-[#F25C22] tracking-tight whitespace-nowrap">0 đ</div>
        </div>
        <button id="btnCheckoutFromCartPage" type="button" onclick="proceedToCheckoutFromCart()" class="px-3.5 sm:px-5 py-2.5 sm:py-3 rounded-xl sm:rounded-2xl bg-[#F25C22] hover:bg-[#d84814] disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none text-white text-xs sm:text-sm font-extrabold shadow-md shadow-orange-500/25 cursor-pointer disabled:cursor-not-allowed transition-all active:scale-95 disabled:active:scale-100 whitespace-nowrap shrink-0 flex items-center justify-center">
          Thanh toán (<span id="cartCheckoutSelectedCount">0</span>)
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Chọn Ngày cho Item Giỏ Hàng -->
  <div id="modalCartDatePicker" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-sm font-extrabold text-slate-900">Đổi ngày sử dụng</h3>
          <p id="cartDatePickerPkgTitle" class="text-xs text-slate-500 truncate max-w-[240px]">-</p>
        </div>
        <button type="button" onclick="closeCartDatePicker()" class="p-1.5 text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
      </div>
      <div class="flex items-center justify-between">
        <button type="button" onclick="changeCartDatePickerMonth(-1)" class="p-1.5 rounded-lg hover:bg-slate-100 cursor-pointer">‹</button>
        <span id="cartDatePickerMonthTitle" class="text-xs font-extrabold">Tháng 11 / 2026</span>
        <button type="button" onclick="changeCartDatePickerMonth(1)" class="p-1.5 rounded-lg hover:bg-slate-100 cursor-pointer">›</button>
      </div>
      <div id="cartDatePickerGrid" class="grid grid-cols-7 gap-1 text-xs"></div>
    </div>
  </div>

  <!-- Modal Xác nhận Xóa -->
  <div id="modalCartDeleteConfirm" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs items-center justify-center p-4" onclick="if(event.target === this) closeCartDeleteConfirmModal()">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-orange-50 text-[#F25C22] flex items-center justify-center text-xl">
        <i class="fa-solid fa-trash-can text-lg"></i>
      </div>
      <h3 id="cartDeleteConfirmTitle" class="text-base font-extrabold text-slate-900">Xác nhận xóa đối tượng</h3>
      <p id="cartDeleteConfirmDesc" class="text-xs text-slate-500 leading-relaxed">Bạn có muốn xóa đối tượng khỏi gói vé này không?</p>
      <div class="grid grid-cols-2 gap-2.5 pt-2">
        <button type="button" onclick="closeCartDeleteConfirmModal()" class="py-2.5 px-4 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-bold cursor-pointer transition-colors active:scale-95">Hủy</button>
        <button type="button" onclick="confirmDeleteCartItems()" class="py-2.5 px-4 rounded-xl bg-[#F25C22] hover:bg-[#d84814] text-white text-xs sm:text-sm font-extrabold cursor-pointer transition-all shadow-md shadow-orange-500/25 active:scale-95">Xóa</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="database/products.db.js"></script>
  <script src="database/crm.db.js"></script>
  <script src="database/orders.db.js"></script>
  <script src="database/cashflow.db.js"></script>
  <script src="database/db-store.js"></script>
  <script src="assets/js/utils.js?v=2.7.0"></script>
  <script src="assets/js/layout.js?v=2.6.0"></script>
  <script src="assets/js/cart.js?v=2.6.1"></script>
</body>
</html>
